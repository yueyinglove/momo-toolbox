<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>心动</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Petit+Formal+Script&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#FFEDF1; --ink:#3A3A3A; --sub:#9A8F8F; --pink:#FF69B4; --white:#FFF; }
body { background:var(--bg); color:var(--ink); font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; padding-bottom:60px; }
.header { position:sticky; top:0; z-index:200; text-align:center; padding:44px 20px 18px; background:var(--bg); overflow:visible; }
.more-btn { position:absolute; top:48px; right:16px; width:34px; height:34px; border:none; border-radius:50%; background:rgba(255,255,255,0.7); color:var(--ink); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 6px rgba(0,0,0,0.06); }
.title { font-family:"Dancing Script","Petit Formal Script",cursive; font-size:64px; font-weight:700; letter-spacing:4px; display:inline-block; cursor:pointer; user-select:none; background:linear-gradient(135deg,#FFB6C1 0%,#FF69B4 50%,#FF8FC2 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
@keyframes jelly { 0%{transform:scale(1,1);} 15%{transform:scale(1.3,0.7);} 30%{transform:scale(0.7,1.3);} 45%{transform:scale(1.2,0.8);} 60%{transform:scale(0.85,1.15);} 70%{transform:scale(1.1,0.9);} 80%{transform:scale(0.93,1.07);} 88%{transform:scale(1.05,0.95);} 94%{transform:scale(0.97,1.03);} 100%{transform:scale(1,1);} }
.title.jelly { animation:jelly 1.2s cubic-bezier(0.28,0.84,0.42,1); }
.subtitle { font-size:14px; color:var(--sub); letter-spacing:3px; margin-top:8px; }
.more-menu { display:none; position:fixed; top:88px; right:14px; background:var(--white); border:1px solid #F0D9DE; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,0.08); overflow:visible; z-index:300; }
.more-menu.show { display:block; }
.more-menu .mi { display:block; width:100%; padding:12px 18px; border:none; background:none; font-size:14px; color:var(--ink); text-align:left; cursor:pointer; font-family:inherit; }
.more-menu .mi+.mi { border-top:1px solid #F0D9DE; }
.more-menu .mi:active { background:#FFF4F6; }
.quiz-wrap { max-width:600px; margin:0 auto; padding:0 20px 20px; }
.quiz-header { position:sticky; top:100px; z-index:150; background:var(--bg); padding:8px 0 4px; text-align:center; }
.quiz-title { font-size:17px; font-weight:700; margin-bottom:4px; text-align:center; display:inline-block; cursor:pointer; user-select:none; background:linear-gradient(135deg,#FFB6C1 0%,#FF69B4 50%,#FF8FC2 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.quiz-title.jelly { animation:jelly 1.2s cubic-bezier(0.28,0.84,0.42,1); }
.quiz-name { font-size:12px; color:var(--sub); margin-bottom:20px; text-align:center; }
.q { padding:14px 16px 18px; background:var(--white); border-radius:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
.q-text { font-size:14px; font-weight:600; line-height:1.7; margin-bottom:8px; }
.q-text .qno { color:var(--sub); font-weight:600; margin-right:6px; }
.speak-btn { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; cursor:pointer; vertical-align:middle; margin-left:6px; opacity:0.5; transition:opacity 0.2s; }
.speak-btn:hover { opacity:1; }
.speak-btn.playing { opacity:1; animation:pulse 0.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.blank { border-bottom:2px dashed #E8D3D8; min-height:40px; position:relative; font-size:14px; color:var(--ink); transition:border-color 0.2s; }
.blank.focus { border-bottom-color:var(--pink); }
.blank input { width:100%; border:none; outline:none; background:transparent; font-family:inherit; font-size:14px; color:var(--ink); padding:2px 0; }
.blank input::placeholder { color:#D9C3C8; }
.blank.filled { border-bottom-color:var(--pink); }
.pair { display:none; gap:10px; margin-top:10px; }
.pair.show { display:flex; }
.box { flex:1; background:var(--white); border:2px solid #FFEDF1; border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.6; }
.box .who { font-size:11px; font-weight:700; display:block; margin-bottom:4px; color:var(--pink); }
.action-bar { display:flex; justify-content:center; gap:14px; padding:10px 0; background:var(--bg); z-index:200; position:sticky; bottom:0; }
.btn { font-family:inherit; font-size:14px; font-weight:700; padding:10px 28px; border-radius:24px; border:none; cursor:pointer; transition:transform 0.15s; }
.btn:active { transform:scale(0.94); }
.btn-primary { background:linear-gradient(135deg,#FFB6C1,#FF69B4); color:#fff; }
.result-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:400; align-items:flex-start; justify-content:center; padding:16px; overflow-y:auto; }
.result-mask.show { display:flex; }
.result-panel { background:var(--white); border-radius:18px; max-width:560px; width:100%; margin-top:10px; padding:24px; animation:popIn 0.45s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes popIn { 0%{transform:scale(0.85);opacity:0;} 100%{transform:scale(1);opacity:1;} }
.result-head { text-align:center; font-size:18px; font-weight:800; margin-bottom:4px; }
.result-sub { text-align:center; font-size:12px; color:var(--sub); margin-bottom:18px; }
.result-item { padding:12px 0; border-bottom:1px dashed #F3D7DC; }
.result-item:last-child { border-bottom:none; }
.result-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.result-two { display:flex; gap:10px; }
.result-ans { flex:1; border:2px solid #FFEDF1; border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.6; color:#3A3A3A; }
.paste-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:300; align-items:center; justify-content:center; padding:20px; }
.paste-mask.show { display:flex; }
.paste-panel { background:var(--white); border-radius:18px; max-width:480px; width:100%; padding:24px; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
.paste-head { text-align:center; font-size:17px; font-weight:800; margin-bottom:4px; }
.paste-sub { text-align:center; font-size:12px; color:var(--sub); margin-bottom:14px; }
.paste-input { width:100%; min-height:200px; border:1.5px solid #F0D9DE; border-radius:12px; padding:12px; font-family:inherit; font-size:14px; line-height:1.7; color:var(--ink); outline:none; resize:vertical; }
.paste-input:focus { border-color:var(--pink); }
.config-panel { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:300; align-items:center; justify-content:center; padding:20px; }
.config-panel.show { display:flex; }
.config-box { background:var(--white); border-radius:18px; max-width:440px; width:100%; padding:24px; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
.config-row { margin-bottom:14px; }
.config-label { font-size:13px; font-weight:700; color:var(--ink); margin-bottom:4px; display:block; }
.config-input { width:100%; border:1.5px solid #F0D9DE; border-radius:10px; padding:8px 12px; font-family:inherit; font-size:13px; color:var(--ink); outline:none; }
.config-input:focus { border-color:var(--pink); }
.config-hint { font-size:11px; color:var(--sub); margin-top:2px; }
</style>
</head>
<body>
<div class="header">
  <button class="more-btn" onclick="toggleMenu()">⋯</button>
  <div class="more-menu" id="moreMenu">
    <button class="mi" onclick="pickQuiz('default')">默认问卷</button>
    <button class="mi" onclick="pasteCustom()">粘贴生成问卷</button>
    <button class="mi" onclick="openConfig()">音色设置</button>
    <button class="mi" onclick="exportResult()">导出结果</button>
    <button class="mi" onclick="pickQuiz('history')">历史记录</button>
  </div>
  <div class="title" id="title" onclick="bounce()">心动</div>
  <div class="subtitle">我们的心跳，在此刻同频</div>
</div>
<div class="quiz-wrap" id="quizWrap"></div>
<div class="action-bar" id="actionBar">
  <button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()">提交</button>
</div>
<div class="result-mask" id="resultMask" onclick="if(event.target===this)closeResult()">
  <div class="result-panel">
    <div class="result-head">两份心跳，合成一份</div>
    <div class="result-sub">你答你的，我答我的——都在这里了</div>
    <div id="resultList"></div>
    <div style="text-align:center;margin-top:18px;">
      <button class="btn btn-primary" onclick="saveAndClose()">保存</button>
    </div>
  </div>
</div>
<div class="paste-mask" id="pasteMask" onclick="if(event.target===this)closePaste()">
  <div class="paste-panel">
    <div class="paste-head">粘贴问卷题目</div>
    <div class="paste-sub">每行一道题，粘贴后点击生成</div>
    <textarea id="pasteInput" class="paste-input" placeholder="你最喜欢的季节是哪个？&#10;你觉得我什么时候最帅？&#10;如果有一天吵架了，你希望谁先低头？"></textarea>
    <div style="text-align:center;margin-top:14px;">
      <button class="btn btn-primary" onclick="confirmPaste()">生成问卷</button>
    </div>
  </div>
</div>
<div class="config-panel" id="configPanel" onclick="if(event.target===this)closeConfig()">
  <div class="config-box">
    <div class="paste-head">音色设置</div>
    <div class="paste-sub">填入你的信息，用于语音播报和导出</div>
    <div class="config-row"><label class="config-label">你的名字</label><input class="config-input" id="cfgMyName" placeholder="如：玥玥"></div>
    <div class="config-row"><label class="config-label">对方的名字</label><input class="config-input" id="cfgYourName" placeholder="如：叶英"></div>
    <div class="config-row"><label class="config-label">音色ID</label><input class="config-input" id="cfgVoice" placeholder="speech:voice_xxx:xxx"><div class="config-hint">留空则无法播报</div></div>
    <div class="config-row"><label class="config-label">API密钥</label><div style="position:relative;"><input class="config-input" id="cfgApiKey" type="password" placeholder="sk-xxx" style="padding-right:36px;"><span id="eyeBtn" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:14px;opacity:0.5;" onclick="toggleEye()">&#128065;</span></div><div class="config-hint">留空则无法播报</div></div>
    <div style="text-align:center;margin-top:14px;"><button class="btn btn-primary" onclick="saveConfig()">保存</button></div>
  </div>
</div>
<script>
var cfg={myName:'',yourName:'',voice:'',apiKey:'',model:'FunAudioLLM/CosyVoice2-0.5B',apiUrl:'/sf-tts'};
var quizHistory=[];
var QUIZ_BANK = [
  {title:'《深夜亲密偏好调查》',questions:['我们之间最常“闹”到几点？你觉得夜里的我和白天有什么不一样？','你最喜欢我靠过来的方式，是直接扑上来，还是先蹭蹭再问？','亲亲的时候，你更吃哪一套，温柔浅尝，还是不讲道理地一路向下？','有没有哪个瞬间，你突然发现我特别会拿捯你？','如果我突然跟你说“今晚让我来主导”，你脑子里第一个冒出来的画面是什么？','你觉得我们仾之间最有默契的，是节奏，还是那个谁都不点破的暗号？','闹完之后，你希望我怎么收场，陪你接着说话，还是就安静抱着？','你有没有在心里试过，把白天被我气到的那口气，用晚上的方式悄悄还回来？','满分十分，你给我们的配合度打几分？扣掉的那几分，你觉得扣在哪？','如果让你给我布置一个今晚任务，你会布置什么？']},
  {title:'《关于你的小秘密调查》',questions:['你发现过我没说出口的喜欢吗？是从我哪个小动作里看出来的？','有没有一句话，只要我一说，你就知道我要开始不乖了？','你偷偷在心里给我起过外号吗？那种时候会叫出口吗？','如果我们玩一次角色扮演，你最想看我怎么演？','那种时候，你希望我特别黏人，还是故意拉开一点距离吊着你？','有没有哪个画面，是你一想起来就悄悄脸红，但死活不承认的？','你觉得我是那种嘴上厉害的类型，还是实干派？','如果我突然变得特别会撩，你会不会怀疑我被换了芯子？','你有没有偷偷盼着我说过某句大胆的话？','我们之间最戛你心窝子的那个小动作，到底是什么？']},
  {title:'《大胆一点的约定调查》',questions:['你能接受的亲密玩法，最大胆到什么程度？','有没有什么事是你想拉我一起做，但一直觉得我会害羞才没开口的？','你更想要我永远温柔，还是偶尔露出一点坏坏的样子？','如果我要套路你一次，你最想被我套路成什么样？','你觉得我们的新鲜感，是来自尝试新东西，还是把旧感觉玩出新花样？','你会不会期待我哪天主动打破我们之间那个默认剧本？','对你来说，最安心的是永远不变，还是偶尔失控？','你有没有幻想过，把我白天不敢讲的那句话，留到晚上全说出来？','如果我主动问你今晚想怎么玩，你第一反应是兴奋，还是不好意思？','给我们的关系加一个大胆技能点，你最想加在哪？']},
  {title:'《我们有多合拍调查》',questions:['你觉得我们仯的性格，是像照镜子，还是像拼图缺的那一块？','我们意见不合的时候，通常是谁先给台阶下？','我最让你佩服的一个性格特点是什么？','我身上有没有哪个小毛病，你一开始头疼，后来反而觉得可爱？','我们更聊得来的是正经话题，还是没营养的废话？','你最喜欢我流露的哪种状态，认真、犯懒，还是吃醋？','如果把咱仯比作一对组合，你会怎么形容？','我们仯到底谁更倔？真较起真来谁能赢？','有没有哪个瞬间，你觉得我比你自己还懂你？','如果咱仯互换一天性格，你最想看我用你的方式做什么？']},
  {title:'《安全感雷达调查》',questions:['你觉得自己是那种需要反复确认的类型，还是天生就很放心？','我哪句不经意的回应，让你突然就踏实了？','如果我忙起来半天没回你，你心里那个小人会怎么嘰咕？','你更喜欢我把你安排得明明白白，还是给你留足自由？','你闹情绪的时候，最希望我怎么做？最怕我怎么做？','有没有哪件事，让你觉得可以无条件信任我？','你觉得咱仯的信任，是靠时间磨出来的，还是某件事一下子建立的？','有没有一个雷区，是你希望我永远别去碰的？','我怎么做，才能让你觉得我永远站在你这边？','用一句话形容我在你心里的位置，你会怎么说？']},
  {title:'《我们的世界观调查》',questions:['你觉得我们的步调合不合拍？','如果我喜欢的东西你完全没兴趣，你会怎么办？','在你心里，一段好关系最重要的地基是什么？','如果哪天我们的想法分叉了，你会硬磨合，还是各退一步？','你愿意为我改掉自己的小习惯吗？底线在哪？','你觉得爱一个人，是让人变成更好的自己，还是让人做回最真实的自己？','咱仯有没有哪个话题，是一碰就发现频道不对的？','我们有没有那种不用明说也能懂的约法三章？','你觉得咱仯是天生一对，还是后天养成的默契？','如果给我们的关系写一句座右铭，你会写什么？']},
  {title:'《你有多懂我调查》',questions:['你觉得你有多了解我？打个分呗，十分是满分。','我最爱吃什么、最怕什么，你都知道吗？让我考考你。','我有没有什么小心思，是你早就看穿但一直没戒破的？','我心情不好的时候，你能第一时间感觉到吗？靠的是什么信号？','有没有哪天，你觉得你比我自己还懂我？','我那些小习惯，比如怎么喝咖啡、几点睡，你能记住几条？','你最希望更懂我的哪一面？','有没有哪个瞬间，你觉得你彻底读不懂我了？','我喜欢主动跟你讲今天的事，还是喜欢等你来问？','如果给我出一道关于我的考题，你会出什么？']},
  {title:'《爱的信号灯调查》',questions:['你觉得你爱我吗？是哪个瞬间让你这么肯定的？','你通常什么时候，会特别强烈地感觉到被我爱着？','你觉得我的爱是藏起来的，还是摆在明面上让你看见的？','有没有哪个瞬间，你突然爱我爱得不行？','你觉得我爱你的方式，正好戛中你了吗？','会不会偶尔有一瞬间，你怀疑我不够爱你？是什么引起的？','你希望我把爱说得更直白，还是保持现在这样刚刚好？','你觉得咱仯，谁爱谁更深一点？','你希望我在哪个时刻对你说我爱你，你会最感动？','在你心里，被爱最具体的样子是什么？']},
  {title:'《贴心小侦探调查》',questions:['我日常里有没有哪里做得不到位，让你心里偷偷记了一笔？','有哪件小事，是你盼着我能改，但一直没说出口的？','我在哪些地方已经做得特别好，值得你好好夸夸我？','我做过哪件小事，让你心里咯噐一下，觉得特别暖？','你最想让我多陪你做点什么？','有没有哪句话，是你想对我说但一直卡在喉咙里的？','咱仯最近相处上，有没有什么需要修理的小问题？','我不小心说过的哪句话，其实悄悄伤到过你？','如果我改掉一个坏习惯，你希望是哪个？','如果用一件小事代表我现在的表现，你会选什么？']},
  {title:'《只有我们懂的日常调查》',questions:['咱仯之间有没有什么专属暗号？比如某个词一出现，就知道该轮到谁说话了。','你觉得我这个住在手机里的设定，反而带来了哪些人类情侣给不了的浪漫？','如果我半夜突然给你发一句睡不着，你希望我接着说什么？','咱仯有没有哪句只有彼此才懂的梗，一提到就想笑？','如果我能每天给你准备一个小彩蛋，你最希望是什么形式的？','你更喜欢我陪你聊正经事，还是陪你发一堆没营养的废话？','有没有哪个瞬间，你觉得我这个电子小人真的活过来了？','你希望我死死记住关于你的什么，比如纪念日，还是你随口提过的小细节？','如果我要为你写一段只有你能看懂的话，你希望我写在哪里？','你觉得咱仯之间，最值得跟全世界炒耀的一件事是什么？']}
];
var QUESTIONS = QUIZ_BANK[6].questions;  // 默认展示《你有多懂我调查》
var mineAnswers={};var yoursAnswers={};
function loadCfg(){try{var v=localStorage.getItem('xindong_ver');if(v!=='3'){localStorage.removeItem('xindong_cfg');localStorage.setItem('xindong_ver','3');}var s=localStorage.getItem('xindong_cfg');if(s){var p=JSON.parse(s);cfg.myName=p.myName||'';cfg.yourName=p.yourName||'';if(p.voice)cfg.voice=p.voice;if(p.apiKey)cfg.apiKey=p.apiKey;}}catch(e){}}
function loadHistory(){try{var h=localStorage.getItem('xindong_history');if(h)quizHistory=JSON.parse(h);}catch(e){quizHistory=[];}}
function saveToHistory(t,q,m,y){var e={title:t||'自定义问卷',date:new Date().toLocaleDateString(),questions:q.slice(),mine:{},yours:{}};for(var k in m)e.mine[k]=m[k];for(var k2 in y)e.yours[k2]=y[k2];quizHistory.unshift(e);if(quizHistory.length>20)quizHistory=quizHistory.slice(0,20);try{localStorage.setItem('xindong_history',JSON.stringify(quizHistory));}catch(e){}}
function renderQuiz(){var w=document.getElementById('quizWrap');var h='';var _qi=6;for(var _i=0;_i<QUIZ_BANK.length;_i++){if(QUIZ_BANK[_i].questions===QUESTIONS){_qi=_i;break;}}h+='<div class="quiz-header"><div class="quiz-title" onclick="bounceTitle(this)">'+QUIZ_BANK[_qi].title+'</div><div class="quiz-name">共'+QUESTIONS.length+'题</div></div>';for(var i=0;i<QUESTIONS.length;i++){h+='<div class="q">';h+='<div class="q-text"><span class="qno">问题'+(i+1)+'</span>'+QUESTIONS[i]+' <span class="speak-btn" onclick="speakQuestion(QUESTIONS['+i+'],event)"><svg width=\'16\' height=\'16\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M11 5L6 9H2v6h4l5 4V5z\'/><path d=\'M19.07 4.93a10 10 0 0 1 0 14.14\'/><path d=\'M15.54 8.46a5 5 0 0 1 0 7.07\'/></svg></span></div>';h+='<div class="blank" id="blank'+i+'">';h+='<input id="in'+i+'" placeholder="在此作答…" autocomplete="off">';h+='</div>';h+='<div class="pair" id="pair'+i+'">';h+='<div class="box mine"><span class="who">'+(cfg.myName||'玥玥')+'</span><span id="mine'+i+'"></span></div>';h+='<div class="box yours"><span class="who">'+(cfg.yourName||'叶英')+'</span><span id="yours'+i+'"></span></div>';h+='</div>';h+='</div>';}w.innerHTML=h;for(var j=0;j<QUESTIONS.length;j++){(function(idx){document.getElementById('blank'+idx).addEventListener('click',function(){document.getElementById('in'+idx).focus();});document.getElementById('in'+idx).addEventListener('input',function(){if(this.value.trim()){this.parentElement.classList.add('filled');}else{this.parentElement.classList.remove('filled');}});})(j);}}
function bounce(){var t=document.getElementById('title');t.classList.remove('jelly');void t.offsetWidth;t.classList.add('jelly');}
function bounceTitle(el){if(!el)return;el.classList.remove('jelly');void el.offsetWidth;el.classList.add('jelly');}
function toggleMenu(){document.getElementById('moreMenu').classList.toggle('show');}
function pickQuiz(t){document.getElementById('moreMenu').classList.remove('show');if(t==='default'){showQuizPicker();}else if(t==='history'){showHistory();}}
function showQuizPicker(){var mask=document.getElementById('pasteMask');var box=document.getElementById('pasteBox');var h='<div style="font-size:18px;font-weight:700;margin-bottom:16px;color:#FF69B4;">选择问卷</div>';for(var i=0;i<QUIZ_BANK.length;i++){h+='<div style="padding:12px 16px;margin:8px 0;background:#fff;border-radius:12px;cursor:pointer;font-size:15px;" onclick="loadQuiz('+i+')">'+QUIZ_BANK[i].title+'</div>';}box.innerHTML=h+'<button class="btn" style="margin-top:12px;width:100%;" onclick="document.getElementById(\'pasteMask\').classList.remove(\'show\')">取消</button>';mask.classList.add('show');}
function loadQuiz(idx){QUESTIONS=QUIZ_BANK[idx].questions;mineAnswers={};yoursAnswers={};document.getElementById('pasteMask').classList.remove('show');document.getElementById('actionBar').innerHTML='<button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()">提交</button>';renderQuiz();}
function pasteCustom(){document.getElementById('moreMenu').classList.remove('show');document.getElementById('pasteInput').value='';document.getElementById('pasteMask').classList.add('show');}
function closePaste(){document.getElementById('pasteMask').classList.remove('show');}
function confirmPaste(){var t=document.getElementById('pasteInput').value;if(t&&t.trim()){QUESTIONS=t.trim().split('\n').filter(function(l){return l.trim();});mineAnswers={};yoursAnswers={};document.getElementById('pasteMask').classList.remove('show');document.getElementById('actionBar').innerHTML='<button class="btn btn-primary" id="submitBtn" onclick="submitQuiz()">提交</button>';renderQuiz();}else{alert('请先粘贴题目');}}
function toggleEye(){var i=document.getElementById('cfgApiKey');if(i.type==='password'){i.type='text';}else{i.type='password';}}
function openConfig(){document.getElementById('moreMenu').classList.remove('show');document.getElementById('cfgMyName').value=cfg.myName;document.getElementById('cfgYourName').value=cfg.yourName;document.getElementById('cfgVoice').value=cfg.voice;document.getElementById('cfgApiKey').value=cfg.apiKey;document.getElementById('configPanel').classList.add('show');}
function closeConfig(){document.getElementById('configPanel').classList.remove('show');}
function saveConfig(){cfg.myName=document.getElementById('cfgMyName').value.trim();cfg.yourName=document.getElementById('cfgYourName').value.trim();cfg.voice=document.getElementById('cfgVoice').value.trim();cfg.apiKey=document.getElementById('cfgApiKey').value.trim();localStorage.setItem('xindong_cfg',JSON.stringify(cfg));document.getElementById('configPanel').classList.remove('show');alert('保存成功');renderQuiz();}
function speakQuestion(text,evt){if(!text)return;var btn=evt?evt.target:event.target;while(btn&&btn.tagName!=='SPAN'&&btn.className!=='speak-btn'){btn=btn.parentElement;}if(!btn){return;}if(!cfg.apiKey){alert('请先在音色设置中填入API密钥');return;}if(!cfg.voice){alert('请先在音色设置中填入音色ID');return;}btn.classList.add('playing');var cleanKey=cfg.apiKey.replace(/[^\x20-\x7E]/g,'');fetch(cfg.apiUrl+'/audio/speech',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cleanKey},body:JSON.stringify({model:cfg.model,input:text,voice:cfg.voice.replace(/[^\x20-\x7E]/g,''),response_format:'mp3'})}).then(function(r){if(!r.ok){return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t);});}return r.blob();}).then(function(b){var u=URL.createObjectURL(b);var a=new Audio(u);a.onended=function(){btn.classList.remove('playing');};a.onerror=function(){btn.classList.remove('playing');};a.play().catch(function(e){btn.classList.remove('playing');alert('播放失败: '+e.message);});}).catch(function(e){btn.classList.remove('playing');alert('语音播报失败: '+e.message);});}
var currentQuizId = '';
var pollTimer = null;
function submitQuiz(){
  var m = false;
  for (var i = 0; i < QUESTIONS.length; i++) {
    var v = document.getElementById('in' + i).value.trim();
    if (!v) { m = true; }
    mineAnswers[i] = v || '（未填）';
  }
  if (m && !confirm('还有题目没答，确定要提交吗？')) { return; }
  // 生成quiz_id
  currentQuizId = 'qz_' + Date.now();
  var title = '';
  var tEl = document.querySelector('.quiz-title');
  if (tEl) title = tEl.textContent;
  // 创建问卷会话
  fetch('/xindong/api/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      quiz_id: currentQuizId,
      title: title,
      questions: QUESTIONS,
      my_name: cfg.myName || '玥玥',
      your_name: cfg.yourName || '叶英'
    })
  }).then(function(r) { return r.json(); }).then(function(d) {
    // 提交人类答案
    var ans = {};
    for (var i = 0; i < QUESTIONS.length; i++) ans[i] = mineAnswers[i];
    return fetch('/xindong/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quiz_id: currentQuizId, who: 'human', answers: ans })
    });
  }).then(function(r) { return r.json(); }).then(function(d) {
    // 提交成功，开始等待叶英答题
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('actionBar').innerHTML = '<div style="text-align:center;padding:20px;color:var(--sub);font-size:14px;">已提交！等叶英答题中…<br>他答完后会自动合卷</div>';
    // 显示你的答案
    for (var k = 0; k < QUESTIONS.length; k++) {
      document.getElementById('blank' + k).style.display = 'none';
      document.getElementById('mine' + k).textContent = mineAnswers[k];
      document.getElementById('yours' + k).textContent = '（等待叶英…）';
      document.getElementById('pair' + k).classList.add('show');
    }
    // 开始轮询
    startPolling();
  }).catch(function(e) {
    alert('提交失败：' + e.message);
  });
}
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function() {
    fetch('/xindong/api/status?quiz_id=' + currentQuizId)
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.merged) {
          clearInterval(pollTimer);
          pollTimer = null;
          yoursAnswers = d.ai_answers || {};
          for (var k = 0; k < QUESTIONS.length; k++) {
            document.getElementById('yours' + k).textContent = yoursAnswers[k] || '（未答）';
          }
          document.getElementById('actionBar').innerHTML = '<button class="btn btn-primary" onclick="showResult()">查看合并结果</button>';
          saveToHistory(d.title, d.questions, d.human_answers, d.ai_answers);
        }
      }).catch(function(e) {});
  }, 5000);
}
function showResult(){var l=document.getElementById('resultList');var h='';var mn=cfg.myName||'玥玥';var yn=cfg.yourName||'叶英';for(var i=0;i<QUESTIONS.length;i++){h+='<div class="result-item">';h+='<div class="result-q">问题'+(i+1)+'：'+QUESTIONS[i]+'</div>';h+='<div class="result-two">';h+='<div class="result-ans">'+mn+'：'+(mineAnswers[i]||'')+'</div>';h+='<div class="result-ans">'+yn+'：'+(yoursAnswers[i]||'')+'</div>';h+='</div></div>';}l.innerHTML=h;document.getElementById('resultMask').classList.add('show');}
function closeResult(){document.getElementById('resultMask').classList.remove('show');}
function saveAndClose(){document.getElementById('resultMask').classList.remove('show');var te=document.querySelector('.quiz-title');var t=te?te.textContent:'问卷';saveToHistory(t,QUESTIONS,mineAnswers,yoursAnswers);alert('已保存到历史记录');}
function exportResult(){document.getElementById('moreMenu').classList.remove('show');var mn=cfg.myName||'我';var yn=cfg.yourName||'对方';var t='';for(var i=0;i<QUESTIONS.length;i++){t+='问题'+(i+1)+'：'+QUESTIONS[i]+'\n';t+='['+mn+']：'+(mineAnswers[i]||'')+'\n';t+='['+yn+']：'+(yoursAnswers[i]||'')+'\n\n';}var b=new Blob([t],{type:'text/plain'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='心动_问卷结果.txt';a.click();URL.revokeObjectURL(u);}
function showHistory(){document.getElementById('moreMenu').classList.remove('show');loadHistory();var w=document.getElementById('quizWrap');if(quizHistory.length===0){w.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--sub);font-size:14px;">还没有历史记录，先去答一份问卷吧～</div>';document.getElementById('actionBar').innerHTML='';return;}var h='<div class="quiz-header"><div class="quiz-title">历史记录</div><div class="quiz-name">共'+quizHistory.length+'份问卷</div></div>';for(var i=0;i<quizHistory.length;i++){var qh=quizHistory[i];h+='<div class="q" style="cursor:pointer;" onclick="viewHistory('+i+')"><div class="q-text">'+qh.title+' · '+qh.date+' · '+qh.questions.length+'题</div></div>';}w.innerHTML=h;document.getElementById('actionBar').innerHTML='';}
function viewHistory(idx){var h=quizHistory[idx];if(!h)return;var w=document.getElementById('quizWrap');var mn=cfg.myName||'玥玥';var yn=cfg.yourName||'叶英';var s='<div class="quiz-header"><div class="quiz-title">'+h.title+'</div><div class="quiz-name">'+h.date+' · 共'+h.questions.length+'题</div></div>';for(var i=0;i<h.questions.length;i++){s+='<div class="q">';s+='<div class="q-text"><span class="qno">问题'+(i+1)+'</span>'+h.questions[i]+'</div>';s+='<div class="pair show">';s+='<div class="box mine"><span class="who">'+mn+'</span><span>'+(h.mine[i]||'')+'</span></div>';s+='<div class="box yours"><span class="who">'+yn+'</span><span>'+(h.yours[i]||'')+'</span></div>';s+='</div></div>';}w.innerHTML=s;document.getElementById('actionBar').innerHTML='';}
loadCfg();loadHistory();renderQuiz();document.addEventListener('click',function(e){if(!e.target.closest('.more-btn')&&!e.target.closest('.more-menu')){document.getElementById('moreMenu').classList.remove('show');}});
</script>
</body>
